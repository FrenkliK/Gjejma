name: Publiko aplikacionin Windows dhe APK-në Android

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - "desktop/**"
      - "server/**"
      - "web/**"
      - "package.json"
      - ".github/workflows/release.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Gjejma.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Gjejma.apk
          if-no-files-found: error

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Kontrollo sintaksën e JavaScript-it
        run: |
          node --check server/server.js
          node --check server/collector.js
          node --check web/app.js
          node --check desktop/main.js
          node --check desktop/forge.config.js
      - name: Vendos versionin e paketës Windows
        working-directory: desktop
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]
          } else {
            $version = "1.0.$env:GITHUB_RUN_NUMBER"
          }
          npm pkg set version=$version
      - name: Install desktop build tools
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Package Windows installer
        working-directory: desktop
        run: npm run make
      - name: Kontrollo aplikacionin e paketuar
        shell: pwsh
        run: |
          $application = Get-ChildItem -Path desktop/out -Filter "Gjejma.exe" -File -Recurse | Select-Object -First 1
          if (-not $application) { throw "Gjejma.exe was not produced by the desktop build." }
          $smokeLog = Join-Path $env:RUNNER_TEMP "gjejma-smoke.log"
          $env:GJEJMA_SMOKE_LOG = $smokeLog
          $output = & $application.FullName --squirrel-firstrun --gjejma-smoke-test 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Host
          if (Test-Path $smokeLog) { Get-Content $smokeLog | Write-Host }
          if ($exitCode -ne 0) { throw "The packaged Gjejma app failed its local startup check (exit $exitCode)." }
          if ($output -notmatch "GJEJMA_SMOKE_OK") { throw "The packaged Gjejma app skipped its startup check." }
      - name: Prepare installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path desktop/out/make -Filter "Gjejma-Setup.exe" -File -Recurse | Select-Object -First 1
          if (-not $installer) { throw "Gjejma Windows installer was not produced." }
          Copy-Item -LiteralPath $installer.FullName -Destination Gjejma-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Gjejma-Setup.exe
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [android, windows-desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release
      - name: Publish both downloads together
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "branch" ]; then
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REF_NAME}" --jq .sha)"
            if [ "$current_sha" != "$GITHUB_SHA" ]; then
              echo "A newer commit is already on $REF_NAME; skipping this stale release."
              exit 0
            fi
          fi
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            release_tag="$REF_NAME"
          else
            release_tag="gjejma-$RUN_NUMBER"
          fi
          gh release create "$release_tag" release/Gjejma.apk release/Gjejma-Setup.exe \
            --title "Gjejma $release_tag" --latest \
            --notes "Shkarkimet e Gjejma-s për Android dhe Windows. Instaluesi Windows përfshin gjithçka dhe nuk kërkon instalim të Node.js. Kërkimet në kohë reale kërkojnë internet. APK-ja kërkon dyqanet drejtpërdrejt nga telefoni dhe nuk ka nevojë për server të veçantë."

