name: Android release APK

on:
  push:
    branches: [main, master]
    paths: ["android/**", ".github/workflows/android-release.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build standalone APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Prepare standalone download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Gjejma.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            release_tag="$REF_NAME"
          else
            release_tag="android-$RUN_NUMBER"
          fi
          gh release create "$release_tag" Gjejma.apk --title "Gjejma Android $release_tag" --latest --notes "Standalone Android APK. No Gjejma server or computer is required. Refresh public shop feeds over the internet; product catalog is stored on the phone and searches work offline. Debug-signed for sideloading, not Play Store distribution."

