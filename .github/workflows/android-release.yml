name: Android release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build standalone APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Prepare standalone download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Gjejma.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Gjejma.apk --title "Gjejma $GITHUB_REF_NAME" --notes "Standalone APK for Android sideloading. Saves the product catalogue on the phone; internet is needed only to refresh shop feeds. Debug-signed for sideloading, not Play Store distribution."

